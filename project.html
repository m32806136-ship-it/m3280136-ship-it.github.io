<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Coding Tool</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111827;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: #1f2937;
      border-bottom: 2px solid #374151;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .panel {
      width: 50%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .panel h2 {
      padding: 10px;
      background: #1f2937;
      border-bottom: 1px solid #374151;
      text-align: center;
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      padding: 15px;
      background: #0f172a;
      color: #f8fafc;
      font-size: 15px;
      font-family: Consolas, monospace;
    }

    iframe {
      flex: 1;
      border: none;
      background: white;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <button onclick="runCode()">Run</button>
    <button onclick="openPreview()">Preview</button>
    <button onclick="exportFile()">Export</button>
    <button onclick="document.getElementById('importFile').click()">
      Import
    </button>
    <input type="file" id="importFile" accept=".html" />
  </div>

  <div class="main">
    <div class="panel">
      <h2>Input</h2>
      <textarea id="codeInput"><!DOCTYPE html>
<html>
<head>
  <title>My Page</title>
</head>
<body>
  <h1>Hello World!</h1>
  <p>Start coding here.</p>
</body>
</html></textarea>
    </div>

    <div class="panel">
      <h2>Output</h2>
      <iframe id="output"></iframe>
    </div>
  </div>

  <script>
    const codeInput = document.getElementById('codeInput');
    const output = document.getElementById('output');
    const importFile = document.getElementById('importFile');

    function runCode() {
      output.srcdoc = codeInput.value;
    }

    function openPreview() {
      const newWindow = window.open();
      newWindow.document.open();
      newWindow.document.write(codeInput.value);
      newWindow.document.close();
    }

    function exportFile() {
      const blob = new Blob([codeInput.value], {
        type: 'text/html'
      });

      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'project.html';
      link.click();
    }

    importFile.addEventListener('change', (event) => {
      const file = event.target.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = (e) => {
        codeInput.value = e.target.result;
      };

      reader.readAsText(file);
    });

    runCode();
  </script>

</body>
</html>
